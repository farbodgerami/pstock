server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;

  # Security headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
  add_header Permissions-Policy "geolocation=(), microphone=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Serve service worker and index with no caching so updates propagate quickly
  location = /service-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    try_files /service-worker.js =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    try_files $uri =404;
  }

  # Prefer returning index.html for HTML navigation requests (SPA fallback)
  location / {
    # try to serve file directly, otherwise fallback to index.html
    try_files $uri $uri/ /index.html;
  }

  # Static assets: allow long caching (since they are content-hashed)
  location ~* \.(?:manifest|appcache|css|js|mjs|json|xml|txt|ico|png|jpg|jpeg|webp|gif|svg|map)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Fallback for anything else
  error_page  500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}


