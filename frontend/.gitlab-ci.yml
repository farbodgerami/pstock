stages:
  - build
  - deploy
 
variables:
  DOCKER_IMAGE: docker:27.1.1-dind
  REGISTEY_LOGIN: docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
  IMAGE_PATH: reg.cicd.tlow.ir/root/tlow-front
  VERSION: v1.0.0
  PROJECT_DIR: /opt/services/tlow-front

default:
  image: docker:dind
  before_script:
    - ${REGISTEY_LOGIN}


build-images-Stage:
  image: ${DOCKER_IMAGE}
  stage: build
  script:
    - sed -i 's|^VITE_API_URL=.*|VITE_API_URL=https://api.stage.tlow.ir|g' .env
    - sed -i 's|^VITE_ANDROID_URL=.*|VITE_ANDROID_URL=https://james.s3.ir-thr-at1.arvanstorage.ir/stagetlow.apk?versionId=|g' .env
    - docker build -t ${IMAGE_PATH}:${VERSION}-stage .
    - docker push ${IMAGE_PATH}:${VERSION}-stage
  only: ['develop' ]


build-images-Production:
  image: ${DOCKER_IMAGE}
  stage: build
  script:
    - sed -i 's|^VITE_API_URL=.*|VITE_API_URL=https://api.tlow.ir|g' .env
    - docker build -t ${IMAGE_PATH}:${VERSION}-production .
    - docker push ${IMAGE_PATH}:${VERSION}-production
  only: ['main' ]
#

deploy-development:
  image: ${DOCKER_IMAGE}
  stage: deploy
  needs: ['build-images-Stage']
  variables:
    DOMAIN_NAME: tlow.ir
    TLOW_FRONT_DOMAIN: stage
    STAGE: stage
    SSH_ADDR: 185.226.118.115
    SSH_PORT: 8431
    SSH_USER: root
  before_script:
    - ${REGISTEY_LOGIN}
    - 'command -v ssh-agent >/dev/null || ( apk add --update openssh )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
 
  script:
    - |
      ssh -o StrictHostKeyChecking=no -p ${SSH_PORT} ${SSH_USER}@${SSH_ADDR} "
      [ -d ${PROJECT_DIR} ] || mkdir -p ${PROJECT_DIR}
      "
      scp -o StrictHostKeyChecking=no -P${SSH_PORT} compose.yml ${SSH_USER}@${SSH_ADDR}:${PROJECT_DIR}/
      ssh -o StrictHostKeyChecking=no -p ${SSH_PORT} ${SSH_USER}@${SSH_ADDR} "
      ${REGISTEY_LOGIN}
      cd ${PROJECT_DIR}  
      sed -i 's/VERSION/${VERSION}-stage/g' compose.yml  
      sed -i 's/TLOW_FRONT_DOMAIN/${TLOW_FRONT_DOMAIN}.${DOMAIN_NAME}/g' compose.yml 
      docker compose pull  
      docker compose up -d
      "
  environment:
    name: develop
    url: https://${DOMAIN_NAME}
  only: ['develop']


deploy-Production:
  image: ${DOCKER_IMAGE}
  stage: deploy
  needs: ['build-images-Production']
  variables:
      DOMAIN_NAME: tlow.ir
      STAGE: deploy
      SSH_ADDR: 185.226.117.78
      SSH_PORT: 8431
      SSH_USER: root
  before_script:
    - ${REGISTEY_LOGIN}
    - 'command -v ssh-agent >/dev/null || ( apk add --update openssh )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  script:
      - |
        ssh -o StrictHostKeyChecking=no -p ${SSH_PORT} ${SSH_USER}@${SSH_ADDR} "
        [ -d ${PROJECT_DIR} ] || mkdir -p ${PROJECT_DIR}
        "
        scp -o StrictHostKeyChecking=no -P${SSH_PORT} compose.yml ${SSH_USER}@${SSH_ADDR}:${PROJECT_DIR}/
        ssh -o StrictHostKeyChecking=no -p ${SSH_PORT} ${SSH_USER}@${SSH_ADDR} "
        ${REGISTEY_LOGIN}
        cd ${PROJECT_DIR}  
        sed -i 's/VERSION/${VERSION}-production/g' compose.yml  
        sed -i 's/TLOW_FRONT_DOMAIN/${DOMAIN_NAME}/g' compose.yml 
        docker compose pull  
        docker compose up -d
        "
  environment:
    name: production
    url: https://${DOMAIN_NAME}
  only: ['main']
  # when: manual
  #