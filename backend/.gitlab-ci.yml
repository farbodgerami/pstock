stages:
  - build
  - deploy

 
variables:
  DOCKER_IMAGE: docker:27.1.1-dind
  REGISTEY_LOGIN: docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
  IMAGE_PATH: reg.cicd.tlow.ir/root/<project_name>
  VERSION: v1.0.0
  PROJECT_DIR: /opt/services/<project_name>

default:
  image: docker:dind
  before_script:
    - ${REGISTEY_LOGIN}

build-images-Stage:
  image: ${DOCKER_IMAGE}
  stage: build
  script:

    - docker build -t ${IMAGE_PATH}:${VERSION}-stage .
    - docker push ${IMAGE_PATH}:${VERSION}-stage
  only: ['develop' ]

build-images-Production:
  image: ${DOCKER_IMAGE}
  stage: build
  script:
    
    - docker build -t ${IMAGE_PATH}:${VERSION}-production .
    - docker push ${IMAGE_PATH}:${VERSION}-production


build-images-merge_requests:
  image: ${DOCKER_IMAGE}
  stage: build
  script:
    
    - docker build -t ${IMAGE_PATH}:${VERSION}-merge_requests .
    - docker push ${IMAGE_PATH}:${VERSION}-merge_requests
  only: ['merge_requests' ]


deploy-merge_requests:
  image: ${DOCKER_IMAGE}
  stage: deploy
  needs: ['build-images-merge_requests']
  variables:
 
     
    SSH_ADDR: 185.226.118.115
    SSH_PORT: 8431
    SSH_USER: root
    PROJECT_DIR: /opt/services/tmp
  before_script:
    - ${REGISTEY_LOGIN}
    - 'command -v ssh-agent >/dev/null || ( apk add --update openssh )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    
  script:
    - |
      printf "$ENV_VAR_STAGE" > .env

      # Create directory if not exist
      ssh -o StrictHostKeyChecking=no -p ${SSH_PORT} ${SSH_USER}@${SSH_ADDR} "
      [ -d ${PROJECT_DIR} ] || mkdir -p ${PROJECT_DIR}
      "
      scp -o StrictHostKeyChecking=no -P${SSH_PORT} .env ${SSH_USER}@${SSH_ADDR}:${PROJECT_DIR}/
      scp -o StrictHostKeyChecking=no -P${SSH_PORT} compose_test.yml ${SSH_USER}@${SSH_ADDR}:${PROJECT_DIR}/
      ssh -o StrictHostKeyChecking=no -p ${SSH_PORT} ${SSH_USER}@${SSH_ADDR} "
 
      ${REGISTEY_LOGIN}
      cd ${PROJECT_DIR}  
      sed -i 's/VERSION/${VERSION}-merge_requests/g' compose_test.yml 
      docker compose -f compose_test.yml pull  
      docker compose -f compose_test.yml up -d
      sleep 5
      docker exec -i backend backend/test
      docker compose -f compose_test.yml down -v 
      rm -r ${PROJECT_DIR}
      "
  environment:
    name: deploy-merge_requests
     
  only: ['merge_requests']

deploy-development:
  image: ${DOCKER_IMAGE}
  stage: deploy
  needs: ['build-images-Stage']
  variables:
 
     
    SSH_ADDR: 185.226.118.115
    SSH_PORT: 8431
    SSH_USER: root
  before_script:
    - ${REGISTEY_LOGIN}
    - 'command -v ssh-agent >/dev/null || ( apk add --update openssh )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    
  script:
    - |
      printf "$ENV_VAR_STAGE" > .env

      # Create directory if not exist
      ssh -o StrictHostKeyChecking=no -p ${SSH_PORT} ${SSH_USER}@${SSH_ADDR} "
      [ -d ${PROJECT_DIR} ] || mkdir -p ${PROJECT_DIR}
      "
      scp -o StrictHostKeyChecking=no -P${SSH_PORT} .env ${SSH_USER}@${SSH_ADDR}:${PROJECT_DIR}/
      scp -o StrictHostKeyChecking=no -P${SSH_PORT} compose.yml ${SSH_USER}@${SSH_ADDR}:${PROJECT_DIR}/
      ssh -o StrictHostKeyChecking=no -p ${SSH_PORT} ${SSH_USER}@${SSH_ADDR} "
 
      ${REGISTEY_LOGIN}
      cd ${PROJECT_DIR}  
      sed -i 's/VERSION/${VERSION}-stage/g' compose.yml  
 
      docker compose pull  
      docker compose up -d
      "
  environment:
